name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: Test engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Check Windows code on Linux
        if: runner.os == 'Linux'
        run: cargo clippy -p goviet-win --features check-on-other-os -- -D warnings

  build-windows:
    name: Build GoViet.exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p goviet-win
      - name: Show size
        shell: pwsh
        run: Get-Item target/release/GoViet.exe | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: GoViet-windows-x64
          path: target/release/GoViet.exe

      - name: Publish release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/GoViet.exe
          generate_release_notes: true
